<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAU Owl Weather</title>
  <meta name="description" content="Weather forecast for Boca Raton and anywhere else, powered by Open-Meteo. Florida Atlantic University themed." />
  <meta name="theme-color" content="#003366" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/fau-logo.svg" alt="FAU logo" class="logo" width="56" height="56" />
      <div>
        <h1>FAU Owl Weather</h1>
        <p class="tagline">Florida Atlantic University &middot; Boca Raton</p>
      </div>
    </div>
    <div class="unit-toggle" role="group" aria-label="Temperature units">
      <button type="button" data-unit="fahrenheit" class="active">&deg;F</button>
      <button type="button" data-unit="celsius">&deg;C</button>
    </div>
  </header>

  <main>
    <form id="search-form" class="search" autocomplete="off" role="search">
      <label for="search-input" class="visually-hidden">Search for a city</label>
      <input id="search-input" type="search" placeholder="Search a city (e.g. Jupiter, Miami, Davie)" />
      <button type="submit" class="btn btn-primary">Search</button>
      <button type="button" id="locate-btn" class="btn btn-secondary" title="Use my location">&#x1F4CD;<span class="visually-hidden">Use my location</span></button>
      <button type="button" id="home-btn" class="btn btn-secondary" title="Back to Boca Raton">&#x1F989;<span class="visually-hidden">Back to Boca Raton</span></button>
      <ul id="search-results" class="search-results" hidden></ul>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="current" class="card current" hidden>
      <div class="current-main">
        <div>
          <h2 id="location-name">Boca Raton, Florida</h2>
          <p id="updated" class="muted"></p>
        </div>
        <div class="current-temp">
          <span id="current-icon" class="big-icon" aria-hidden="true"></span>
          <span id="current-temp" class="temp"></span>
        </div>
        <p id="current-desc" class="desc"></p>
      </div>
      <dl class="stats">
        <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Precipitation</dt><dd id="precip"></dd></div>
        <div><dt>UV index</dt><dd id="uv"></dd></div>
        <div><dt>Sunrise / Sunset</dt><dd id="sun"></dd></div>
      </dl>
    </section>

    <section id="hourly-section" class="card" hidden>
      <h3>Next 24 hours</h3>
      <div id="hourly" class="hourly"></div>
    </section>

    <section id="daily-section" class="card" hidden>
      <h3>7-day forecast</h3>
      <ul id="daily" class="daily"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Go Owls! &middot; Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
